name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # The Workers example moved here from devslab-examples, which built it on
  # every push. Keeping that coverage is the point: it is the only place the
  # published package is exercised through a real Hono app at the edge, and a
  # breaking change should fail here rather than in someone's deploy.
  example:
    name: examples/workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: examples/workers/pnpm-lock.yaml
      - working-directory: examples/workers
        run: pnpm install --frozen-lockfile
      - working-directory: examples/workers
        run: pnpm verify

  # The unit suite runs on Node only, which is enough for logic but blind to
  # guarantees that depend on the host honouring a hook. JS-016 was a bypass
  # every Node test passed straight through: Node calls undici's
  # `connect.lookup`, Bun accepts it and never does, so the private-IP check
  # silently vanished there. This job runs the built package on each runtime.
  runtime:
    name: runtime (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one runtime regressing should not hide the others
      matrix:
        runtime: [node, bun, deno]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Installed for every runtime, not just Node: the build runs on Node, and
      # `undici` must be resolvable from node_modules or the pinned modes below
      # degrade to "not installed" and the check passes without testing them.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run the runtime check
        run: |
          case "${{ matrix.runtime }}" in
            node) node scripts/runtime-check.mjs ;;
            bun)  bun scripts/runtime-check.mjs ;;
            deno) deno run -A scripts/runtime-check.mjs ;;
          esac
